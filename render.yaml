services:
  - type: web
    name: quantumgrow-ai
    env: docker
    plan: free # Change to starter/pro if you need more RAM for the ML models
    healthCheckPath: /
    envVars:
      - key: MODE
        value: LIVE
      # NOTE: For LIVE mode to work on Render, you MUST add the following
      # Environment Variables manually in your Render Dashboard:
      # - API_KEY
      # - CLIENT_ID
      # - PASSWORD
      # - TOTP_SECRET
      - key: PORT
        value: 8000
